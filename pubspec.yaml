name: ceylon_snakes
description: A new Flutter project for identifying snakes in Sri Lanka.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_markdown: ^0.6.18
  
  # Core dependencies
  provider: ^6.1.1
  intl: ^0.19.0
  
  # AI & Camera
  flutter_tflite: ^1.0.1
  image_picker: 0.8.9
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # UI
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.6
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.6.0
  connectivity_plus: ^7.0.0
  http_parser: ^4.0.2
  path: ^1.9.0

  # AI ChatBot & Env
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^6.0.1
  tflite_flutter: ^0.12.1
  image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: 0.11.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logoBG.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/images/snakes/
    - .env

    
